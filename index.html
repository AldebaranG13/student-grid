<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grid | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        // ============================================
        // 👮 ADMIN CONFIGURATION (ADD EMAILS HERE)
        // ============================================
        const ADMIN_EMAILS = [
            "aldebaran.gibran@fiwa.sch.id", 
            "teacher@school.edu",
            "aldebaran@example.com"
        ];
        // ============================================

        const appConfig = { appName: "Student Grid", footerText: "© 2025 Node v5.0 (Admin)", themeColor: "#1967d2" };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, setDoc, getDoc, deleteDoc, doc, query, where, orderBy, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // === 🔑 KEYS LOCKED IN ===
        const firebaseConfig = {
            apiKey: "AIzaSyDb0JiAH1fFBbcLfF8pmteX2U7ViBkAfqE",
            authDomain: "student-grid.firebaseapp.com",
            projectId: "student-grid",
            storageBucket: "student-grid.firebasestorage.app",
            messagingSenderId: "34314858632",
            appId: "1:34314858632:web:ce99f6b7e90d27a7f22f3d",
            measurementId: "G-XVHGMWKVDD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentRoom = "Global";
        let unsubscribeChat = null;
        let cachedUsers = {}; 
        let unreadCounts = {};
        let isAdmin = false;

        // --- INIT ---
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('brandName').innerText = appConfig.appName;
            document.querySelector('footer').innerText = appConfig.footerText;
            
            document.getElementById('loginBtn').addEventListener('click', () => signInWithPopup(auth, provider).catch(console.error));
            document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth); document.title = "Student Grid | Login"; });
            
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

            // GUI Buttons
            document.getElementById('openRoomModalBtn').addEventListener('click', () => openModal('roomModal'));
            document.getElementById('closeModalBtn').addEventListener('click', () => closeModal('roomModal'));
            document.getElementById('tabJoin').addEventListener('click', () => switchTab('join'));
            document.getElementById('tabCreate').addEventListener('click', () => switchTab('create'));
            document.getElementById('confirmJoinBtn').addEventListener('click', handleJoinRoom);
            document.getElementById('confirmCreateBtn').addEventListener('click', handleCreateRoom);
            document.getElementById('closeProfileBtn').addEventListener('click', () => document.getElementById('profileCard').style.display = 'none');
        });

        // --- AUTH & CHECK BLOCK STATUS ---
        onAuthStateChanged(auth, async (user) => {
            const loginUI = document.getElementById('loginInterface');
            const appUI = document.getElementById('appInterface');
            
            if (user) {
                // 1. CHECK IF BLOCKED
                const blockRef = doc(db, "blocked_users", user.uid);
                const blockSnap = await getDoc(blockRef);
                if (blockSnap.exists()) {
                    const blockData = blockSnap.data();
                    if (blockData.blockedUntil > Date.now()) {
                        window.location.href = "blocked.html";
                        return;
                    }
                }

                // 2. CHECK ADMIN STATUS
                isAdmin = ADMIN_EMAILS.includes(user.email);
                console.log("Admin Status:", isAdmin);

                loginUI.style.display = 'none';
                appUI.style.display = 'flex';
                renderHeaderAvatar(user);
                await saveUserToDB(user);
                
                loadSavedRooms();
                loadSavedDMs();
                listenForNotifications();
                cacheAllUsers();
                
                switchRoom("Global"); 
            } else {
                loginUI.style.display = 'flex';
                appUI.style.display = 'none';
                document.getElementById('userAvatar').innerHTML = '';
            }
        });

        async function saveUserToDB(user) {
            try {
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);
                const data = { displayName: user.displayName, email: user.email, photoURL: user.photoURL, uid: user.uid, lastSeen: new Date().toISOString() };
                if (!snap.exists()) data.joinedAt = new Date().toISOString();
                await setDoc(userRef, data, { merge: true });
            } catch (e) { console.error(e); }
        }

        function renderHeaderAvatar(user) {
            const imgTag = user.photoURL ? `<img src="${user.photoURL}">` : `<div class="letter-avatar">${user.displayName.charAt(0)}</div>`;
            document.getElementById('userAvatar').innerHTML = imgTag;
        }

        // --- NOTIFICATIONS ---
        function listenForNotifications() {
            const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(10));
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const msg = change.doc.data();
                        if(msg.uid === auth.currentUser.uid) return;
                        if(msg.room === currentRoom) return;
                        handleUnread(msg.room);
                    }
                });
            });
        }

        function handleUnread(roomName) {
            unreadCounts[roomName] = (unreadCounts[roomName] || 0) + 1;
            let item = document.getElementById(`nav-${roomName}`);
            
            if (item) {
                let badge = item.querySelector('.badge');
                if(!badge) {
                    badge = document.createElement('span');
                    badge.className = 'badge';
                    item.appendChild(badge);
                }
                badge.innerText = unreadCounts[roomName];
                badge.style.display = 'flex';
                item.parentNode.insertBefore(item, item.parentNode.firstChild); 
                document.title = `(${unreadCounts[roomName]}) New Message`;
            }
        }

        // --- NAVIGATION ---
        window.switchRoom = function(roomName) {
            currentRoom = roomName;
            unreadCounts[roomName] = 0;
            const item = document.getElementById(`nav-${roomName}`);
            if(item) {
                const badge = item.querySelector('.badge');
                if(badge) badge.style.display = 'none';
            }
            document.title = `Grid | ${roomName.replace('dm_', '')}`;

            let displayTitle = roomName;
            let desc = "Private secure channel";
            
            if(roomName.startsWith("dm_")) {
                const parts = roomName.split('_');
                const otherUid = parts.find(id => id !== auth.currentUser.uid && id !== 'dm');
                if(otherUid && cachedUsers[otherUid]) displayTitle = `🔒 ${cachedUsers[otherUid].displayName}`;
            } else {
                displayTitle = `# ${roomName}`;
                desc = "Room ID: " + roomName;
            }
            document.getElementById('roomTitle').innerText = displayTitle;
            document.getElementById('roomDesc').innerText = desc;

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(item) item.classList.add('active');

            loadMessages(roomName);
        }

        // --- ROOMS MANAGEMENT ---
        function addToSidebar(listId, name, isDm, friendUid = null) {
            const list = document.getElementById(listId);
            const id = isDm ? name : name;
            if(document.getElementById(`nav-${id}`)) return;

            const div = document.createElement('div');
            div.id = `nav-${id}`;
            div.className = 'nav-item';
            
            let label = name;
            let icon = '<span>#</span>';
            let allowDelete = true;
            
            // GLOBAL UNREMOVABLE
            if(name === "Global") {
                allowDelete = false;
                icon = '<span>🌎</span>';
            }

            if(isDm) {
                icon = '<span class="status-dot">●</span>';
                if(friendUid && cachedUsers[friendUid]) {
                    label = cachedUsers[friendUid].displayName;
                } else {
                    label = "Chat"; 
                }
            }

            div.innerHTML = `${icon} <div class="nav-label">${label}</div>`;
            div.onclick = () => switchRoom(id);

            if(allowDelete) {
                const del = document.createElement('span');
                del.innerText = '×';
                del.className = 'delete-btn';
                del.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm("Remove from sidebar?")) {
                        div.remove();
                        removeFromLocal(isDm ? 'myDMs' : 'myRooms', isDm ? friendUid : name);
                    }
                };
                div.appendChild(del);
            }
            
            list.appendChild(div);
        }

        // --- MODAL & ROOM LOGIC ---
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function switchTab(mode) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(mode === 'join' ? 'tabJoin' : 'tabCreate').classList.add('active');
            
            document.getElementById('viewJoin').style.display = mode === 'join' ? 'block' : 'none';
            document.getElementById('viewCreate').style.display = mode === 'create' ? 'block' : 'none';
        }

        function handleJoinRoom() {
            const id = document.getElementById('inputJoinId').value.trim().replace(/ /g, "-");
            if(id) {
                addToSidebar('customRoomsList', id, false);
                saveToLocal('myRooms', id);
                switchRoom(id);
                closeModal('roomModal');
            }
        }

        async function handleCreateRoom() {
            const name = document.getElementById('inputCreateName').value.trim().replace(/ /g, "-");
            const desc = document.getElementById('inputCreateDesc').value.trim();
            
            if(name) {
                const randomId = Math.floor(1000 + Math.random() * 9000);
                const roomId = `${name}-${randomId}`;
                addToSidebar('customRoomsList', roomId, false);
                saveToLocal('myRooms', roomId);
                switchRoom(roomId);
                const sysMsg = `Room Created!\nDescription: ${desc}\nROOM ID: ${roomId} (Share this code)`;
                await addDoc(collection(db, "messages"), {
                    text: sysMsg, uid: "SYSTEM", displayName: "🤖 System", email: "", photoURL: "", room: roomId, createdAt: new Date().toISOString()
                });
                closeModal('roomModal');
                document.getElementById('inputCreateName').value = "";
                document.getElementById('inputCreateDesc').value = "";
            }
        }

        // --- DM LOGIC ---
        function startDM(targetUid) {
            if(targetUid === auth.currentUser.uid) return alert("You cannot DM yourself.");
            
            const ids = [auth.currentUser.uid, targetUid].sort();
            const roomId = `dm_${ids[0]}_${ids[1]}`;
            
            addToSidebar('dmList', roomId, true, targetUid);
            saveToLocal('myDMs', targetUid); 
            
            document.getElementById('profileCard').style.display = 'none'; 
            switchRoom(roomId);
        }

        // --- LOCAL STORAGE ---
        function saveToLocal(key, value) {
            let list = JSON.parse(localStorage.getItem(key) || "[]");
            if(!list.includes(value)) {
                list.push(value);
                localStorage.setItem(key, JSON.stringify(list));
            }
        }
        function removeFromLocal(key, value) {
            let list = JSON.parse(localStorage.getItem(key) || "[]");
            list = list.filter(x => x !== value);
            localStorage.setItem(key, JSON.stringify(list));
        }
        function loadSavedRooms() {
            addToSidebar('customRoomsList', 'Global', false); // Global First
            let list = JSON.parse(localStorage.getItem('myRooms') || "[]");
            list.forEach(name => addToSidebar('customRoomsList', name, false));
        }
        function loadSavedDMs() {
            let list = JSON.parse(localStorage.getItem('myDMs') || "[]");
            setTimeout(() => {
                list.forEach(uid => {
                    const ids = [auth.currentUser.uid, uid].sort();
                    const roomId = `dm_${ids[0]}_${ids[1]}`;
                    addToSidebar('dmList', roomId, true, uid);
                });
            }, 1000); 
        }

        // --- CACHE & PROFILE ---
        function cacheAllUsers() {
            onSnapshot(query(collection(db, "users")), (snapshot) => {
                snapshot.forEach((doc) => {
                    cachedUsers[doc.id] = doc.data();
                });
                const dmList = document.getElementById('dmList');
                Array.from(dmList.children).forEach(div => {
                    const uid = div.id.split('_').find(x => x !== 'dm' && x !== 'nav' && x !== auth.currentUser.uid);
                    if(uid && cachedUsers[uid]) {
                        div.querySelector('.nav-label').innerText = cachedUsers[uid].displayName;
                    }
                });
            });
        }

        // CLICK TO OPEN PROFILE
        window.openProfile = function(uid) {
            const user = cachedUsers[uid] || { displayName: "Unknown", photoURL: "", joinedAt: null };
            const card = document.getElementById('profileCard');
            
            document.getElementById('p-img').src = user.photoURL || "";
            document.getElementById('p-name').innerText = user.displayName;
            document.getElementById('p-joined').innerText = `Joined: ${new Date(user.joinedAt || Date.now()).toLocaleDateString()}`;
            
            const isMe = auth.currentUser.uid === uid;
            
            // Buttons
            document.getElementById('p-edit-btn').style.display = isMe ? 'block' : 'none';
            document.getElementById('p-dm-btn').style.display = !isMe ? 'block' : 'none';
            document.getElementById('p-block-btn').style.display = (isAdmin && !isMe) ? 'block' : 'none';

            // Events
            document.getElementById('p-dm-btn').onclick = () => startDM(uid);
            document.getElementById('p-edit-btn').onclick = editMyNickname;
            document.getElementById('p-block-btn').onclick = () => blockUser(uid);

            card.style.display = 'block';
        }

        async function editMyNickname() {
            const user = auth.currentUser;
            const newName = prompt("New Nickname:", user.displayName);
            if (newName && newName.trim()) {
                await updateProfile(user, { displayName: newName });
                await saveUserToDB(user);
                document.getElementById('p-name').innerText = newName;
                document.getElementById('profileCard').style.display = 'none';
            }
        }

        async function blockUser(uid) {
            const hours = prompt("Block user for how many hours?", "1");
            if(hours) {
                const blockedUntil = Date.now() + (parseInt(hours) * 60 * 60 * 1000);
                await setDoc(doc(db, "blocked_users", uid), {
                    blockedUntil: blockedUntil,
                    blockedBy: auth.currentUser.email
                });
                alert("User blocked.");
                document.getElementById('profileCard').style.display = 'none';
            }
        }

        // --- MESSAGING ---
        const sendMessage = async () => {
            const input = document.getElementById('msgInput');
            const text = input.value;
            const user = auth.currentUser;
            if (!text.trim() || !user) return;

            try {
                await addDoc(collection(db, "messages"), {
                    text: text, uid: user.uid, displayName: user.displayName, email: user.email, photoURL: user.photoURL, room: currentRoom, createdAt: new Date().toISOString()
                });
                input.value = "";
            } catch (e) { console.error(e); }
        };

        window.deleteMessage = async function(msgId) {
            if(confirm("Delete this message?")) {
                await deleteDoc(doc(db, "messages", msgId));
            }
        }

        function loadMessages(room) {
            if (unsubscribeChat) unsubscribeChat();
            const box = document.getElementById('chat-box');
            box.innerHTML = '<div class="loading">Loading...</div>';

            unsubscribeChat = onSnapshot(query(collection(db, "messages"), where("room", "==", room)), (snapshot) => {
                box.innerHTML = ''; 
                let msgs = [];
                snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                msgs.sort((a, b) => (a.createdAt > b.createdAt) ? 1 : -1);

                msgs.forEach((msg) => {
                    const isMe = auth.currentUser && msg.uid === auth.currentUser.uid;
                    const isSenderAdmin = ADMIN_EMAILS.includes(msg.email);
                    
                    if(msg.uid === "SYSTEM") {
                         const div = document.createElement('div');
                         div.className = "system-msg";
                         div.innerHTML = `🛡️ <b>${msg.displayName}</b>: ${msg.text.replace(/\n/g, '<br>')}`;
                         box.appendChild(div);
                         return;
                    }

                    const div = document.createElement('div');
                    div.className = `message-item ${isMe ? 'me' : ''}`;
                    
                    let adminBadge = isSenderAdmin ? '<span class="admin-tag">[OFFICIAL ADMIN]</span>' : '';
                    let deleteBtn = isAdmin ? `<span class="trash-btn" onclick="deleteMessage('${msg.id}')">🗑️</span>` : '';

                    div.innerHTML = `
                        <div class="avatar-small" onclick="openProfile('${msg.uid}')">
                            <img src="${msg.photoURL}" onerror="this.style.display='none'">
                        </div>
                        <div class="msg-content">
                            <div class="msg-header">${msg.displayName} ${adminBadge} ${deleteBtn}</div>
                            <div class="msg-text">${msg.text}</div>
                        </div>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>

    <style>
        :root { --bg: #f2f3f5; --white: #ffffff; --sidebar: #e3e5e8; --blue: #5865F2; --text: #2e3338; --hover: #d4d7dc; --rainbow: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000); }
        body { font-family: 'Roboto', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--white); color: var(--text); }
        
        /* RAINBOW TAG */
        .admin-tag {
            font-size: 10px; font-weight: 900; background: var(--rainbow); 
            background-size: 400%; -webkit-background-clip: text; color: transparent; animation: rainbow 20s linear infinite; margin-left: 5px;
        }
        @keyframes rainbow { 0% { background-position: 0 0; } 100% { background-position: 100% 0; } }

        /* HEADER */
        header { height: 50px; background: var(--white); border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; z-index: 10; }
        .brand { font-weight: 700; font-size: 18px; color: var(--blue); display: flex; align-items: center; gap: 8px; }
        #userAvatar img { width: 32px; height: 32px; border-radius: 50%; }

        #appInterface { display: none; height: calc(100vh - 51px); display: flex; }
        aside { width: 240px; background: var(--sidebar); display: flex; flex-direction: column; padding: 10px; overflow-y: auto; }
        
        .section-title { font-size: 11px; font-weight: bold; color: #6a7480; text-transform: uppercase; margin: 15px 0 5px 10px; }
        
        .nav-item { 
            padding: 8px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 15px; color: #5c5e66; position: relative;
        }
        .nav-item:hover { background: var(--hover); color: #000; }
        .nav-item.active { background: #d4d7dc; color: #000; font-weight: 500; }
        .nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
        .delete-btn { margin-left: auto; font-size: 14px; opacity: 0; }
        .nav-item:hover .delete-btn { opacity: 1; }
        
        .badge { 
            background: #f23f42; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; 
            position: absolute; right: 25px; display: none; font-weight: bold;
        }

        #openRoomModalBtn { 
            font-size: 14px; color: var(--blue); padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; 
        }
        #openRoomModalBtn:hover { text-decoration: underline; }

        main { flex: 1; display: flex; flex-direction: column; background: var(--white); }
        #room-header { height: 55px; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; }
        #roomTitle { font-weight: bold; font-size: 16px; }
        #roomDesc { font-size: 12px; color: #777; }

        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message-item { display: flex; gap: 12px; animation: fadeIn 0.1s; }
        .message-item:hover { background: #fafafa; }
        .avatar-small img { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        .msg-content { display: flex; flex-direction: column; min-width: 0; }
        .msg-header { font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg-text { font-size: 15px; line-height: 1.4; color: #2e3338; word-wrap: break-word; }
        .message-item.me .msg-header { color: var(--blue); }

        .system-msg { background: #f0f4ff; color: #444; padding: 10px; border-radius: 6px; font-size: 13px; border-left: 4px solid var(--blue); margin: 10px 0; }
        
        .trash-btn { cursor: pointer; font-size: 12px; margin-left: 5px; opacity: 0.5; }
        .trash-btn:hover { opacity: 1; }

        .input-container { padding: 20px; }
        .input-wrapper { background: #ebedef; border-radius: 8px; display: flex; align-items: center; padding: 0 15px; }
        input { flex: 1; padding: 12px 0; border: none; background: transparent; outline: none; font-size: 15px; }
        button#sendBtn { border: none; background: none; color: var(--blue); font-size: 20px; cursor: pointer; }

        /* MODAL */
        #roomModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-tabs { display: flex; border-bottom: 1px solid #ddd; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; cursor: pointer; text-align: center; color: #666; font-weight: 500; }
        .tab-btn.active { color: var(--blue); border-bottom: 2px solid var(--blue); }
        .modal-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .primary-btn { width: 100%; padding: 10px; background: var(--blue); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #closeModalBtn { margin-top: 10px; width: 100%; padding: 5px; background: none; border: none; color: #666; cursor: pointer; }

        /* PROFILE */
        #profileCard {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; width: 260px; padding: 20px;
            border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); z-index: 3000; border: 1px solid #ccc;
        }
        .p-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
        .p-header img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; }
        .p-info h4 { margin: 0; font-size: 18px; }
        .p-info span { font-size: 12px; color: #999; }
        
        .p-btn { width: 100%; padding: 8px; margin-top: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
        #p-dm-btn { background: var(--blue); color: white; }
        #p-edit-btn { background: #e3e5e8; color: #333; }
        #p-block-btn { background: #ff0000; color: white; margin-top: 10px; }
        
        #closeProfileBtn { position: absolute; top: 10px; right: 10px; cursor: pointer; font-weight: bold; color: #999; }

        #loginInterface { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #loginBtn { background: var(--blue); color: white; border: none; padding: 12px 30px; border-radius: 4px; cursor: pointer; font-size: 16px; }

        footer { display: none; }
    </style>
</head>
<body>
    <div id="roomModal">
        <div class="modal-content">
            <div class="modal-tabs">
                <div class="tab-btn active" id="tabJoin">Join</div>
                <div class="tab-btn" id="tabCreate">Create</div>
            </div>
            
            <div id="viewJoin">
                <p style="margin-top:0; font-size:14px; color:#555;">Enter the Room ID shared with you.</p>
                <input type="text" class="modal-input" id="inputJoinId" placeholder="Room ID (e.g. Minecraft-X92)">
                <button class="primary-btn" id="confirmJoinBtn">Join Room</button>
            </div>

            <div id="viewCreate" style="display:none;">
                <p style="margin-top:0; font-size:14px; color:#555;">Create a secure space.</p>
                <input type="text" class="modal-input" id="inputCreateName" placeholder="Room Name (e.g. Study-Group)">
                <input type="text" class="modal-input" id="inputCreateDesc" placeholder="Description (e.g. Math Help)">
                <button class="primary-btn" id="confirmCreateBtn">Create & Generate ID</button>
            </div>

            <button id="closeModalBtn">Cancel</button>
        </div>
    </div>

    <div id="profileCard">
        <span id="closeProfileBtn">✕</span>
        <div class="p-header">
            <img id="p-img" src="" alt="User">
            <div class="p-info"><h4 id="p-name">Name</h4><span id="p-joined">Joined: ...</span></div>
        </div>
        <button id="p-dm-btn" class="p-btn">Message</button>
        <button id="p-edit-btn" class="p-btn">Edit Nickname</button>
        <button id="p-block-btn" class="p-btn" style="display:none;">⚠️ BLOCK USER (Admin)</button>
    </div>

    <header>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            <span id="brandName">Grid</span>
        </div>
        <div id="userAvatar"></div>
    </header>

    <div id="loginInterface">
        <h2 style="color: #444;">Welcome Back</h2>
        <button id="loginBtn">Login with Google</button>
    </div>

    <div id="appInterface">
        <aside>
            <div class="section-title">Rooms</div>
            <div id="customRoomsList"></div>
            <div id="openRoomModalBtn"><span>+</span> Join / Create Room</div>

            <div class="section-title">Saved DMs</div>
            <div id="dmList"></div>
        </aside>

        <main>
            <div id="room-header">
                <span id="roomTitle"># Global</span>
                <span id="roomDesc" style="margin-left: auto; color:#ccc; font-size:11px;">Public</span>
            </div>
            <div id="chat-box"></div>
            <div class="input-container">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
                    <button id="sendBtn">➤</button>
                </div>
            </div>
        </main>
    </div>
    <footer>v5.0</footer>
</body>
</html>
